{% extends "powertracker/base.html" %}

{% block title %}Reset Email Sent | Electricity Tracker{% endblock %}

{% block content %}
<section class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="border rounded bg-white p-4 text-center">
                <h1 class="h3 mb-3">Check Your Email</h1>
                <p class="text-muted mb-4">
                    If an account exists for that email, a password reset link has been sent.
                    Please check your inbox and spam folder.
                </p>

                <a href="{% url 'account_login' %}" class="btn btn-dark">
                    Back to Login
                </a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
